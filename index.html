<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCVault - Institutional Bitcoin Allocation</title>
  
  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 Production Core Hooks & DOM Renderer -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- In-Browser Babel Compiler for JSX Interpretation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0f0d]">

  <div id="root"></div>

  <!-- Explicitly pass react and env data-presets to force inline compilation -->
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    /* ═══════════════════════════════════════════════════════
       STORAGE HELPERS
    ═══════════════════════════════════════════════════════ */
    const S = {
      get: (k, d = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
      set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
      del: (k) => localStorage.removeItem(k),
    };

    const ADMIN = { email: "admin@btcvault.io", password: "Admin@2026" };

    const getUsers = () => S.get("bv_users", []);
    const setUsers = (u) => S.set("bv_users", u);
    const getSession = () => S.get("bv_session");
    const setSession = (s) => S.set("bv_session", s);
    const clearSession = () => S.del("bv_session");
    const getWithdrawals = () => S.get("bv_withdrawals", []);
    const setWithdrawals = (w) => S.set("bv_withdrawals", w);

    const uid = () => Math.random().toString(36).slice(2, 10);
    const now = () => new Date().toISOString();
    const fmtDate = (d) => new Date(d).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });

    const PLANS = [
      { id: "bronze", name: "Bronze", min: 100, max: 999, roi: 5, days: 7, color: "#cd7f32", icon: "🥉" },
      { id: "silver", name: "Silver", min: 1000, max: 4999, roi: 12, days: 14, color: "#94a3b8", icon: "🥈" },
      { id: "gold", name: "Gold", min: 5000, max: 19999, roi: 25, days: 30, color: "#f7931a", icon: "🥇" },
      { id: "diamond", name: "Diamond", min: 20000, max: null, roi: 50, days: 60, color: "#22d3ee", icon: "💎" },
    ];

    /* ═══════════════════════════════════════════════════════
       GLOBAL CSS STYLES
    ═══════════════════════════════════════════════════════ */
    const GS = `
    @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --g:#0a0f0d;--g2:#0f1a14;
      --btc:#f7931a;--btc2:#e67e00;--btcl:rgba(247,147,26,.15);
      --gr:#22c55e;--t:#e8f0eb;--t2:#6b8f74;--t3:#3d5944;--bd:rgba(255,255,255,.06);
    }
    body{font-family:'Cabinet Grotesk',sans-serif;background:var(--g);color:var(--t);-webkit-font-smoothing:antialiased}
    .bp{background:linear-gradient(135deg,var(--btc),var(--btc2));color:#000;font-weight:800;border:none;border-radius:8px;cursor:pointer;transition:all .15s;display:inline-block;text-align:center}
    .bp:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(247,147,26,.35)}
    .bo{background:transparent;border:1.5px solid var(--btc);color:var(--btc);font-weight:700;border-radius:8px;cursor:pointer;transition:all .15s;display:inline-block;text-align:center}
    .bo:hover{background:var(--btcl)}
    .card{background:var(--g2);border:1px solid var(--bd);border-radius:14px;padding:24px}
    .inp{width:100%;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:8px;color:var(--t);font-size:14px;outline:none;margin-top:4px}
    .inp:focus{border-color:var(--btc)}
    .row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd);gap:12px}
    .badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700}
    .bg{background:rgba(34,197,94,.1);color:#22c55e}
    .by{background:rgba(234,179,8,.1);color:#eab308}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--gr);animation:pulse 1.8s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    `;

    /* ═══════════════════════════════════════════════════════
       TOAST NOTICE COMPONENT
    ═══════════════════════════════════════════════════════ */
    function Toast({ msg, type, onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [onClose]);
      const color = type === "err" ? "#ef4444" : "#22c55e";
      return (
        <div style={{ position: "fixed", bottom: 24, right: 24, zIndex: 9999, background: "#0f1a14", border: `1px solid ${color}40`, borderRadius: 12, padding: "13px 20px", color, fontSize: 14, display: "flex", alignItems: "center", gap: 10, boxShadow: "0 8px 40px rgba(0,0,0,.6)", maxWidth: 340 }}>
          <span>{type === "err" ? "❌" : "✅"}</span>
          <span style={{ flex: 1 }}>{msg}</span>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#4a6a52", cursor: "pointer" }}>✕</button>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════
       LANDING PAGE
    ═══════════════════════════════════════════════════════ */
    function Landing({ go }) {
      const [price, setPrice] = useState("77,942.50");
      useEffect(() => {
        const pt = setInterval(() => { setPrice((77800 + Math.random() * 300).toFixed(2)); }, 3000);
        return () => clearInterval(pt);
      }, []);

      return (
        <div style={{ background: "var(--g)", minHeight: "100vh" }}>
          <nav style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 100, padding: "16px 24px", display: "flex", alignItems: "center", justifyContent: "space-between", background: "rgba(10,15,13,.96)", borderBottom: "1px solid rgba(247,147,26,.12)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 26, fontWeight: 900, color: "var(--btc)" }}>₿</span>
              <span style={{ fontSize: 20, fontWeight: 900 }}>BTC<span style={{ color: "var(--btc)" }}>Vault</span></span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="bo" onClick={() => go("login")} style={{ padding: "6px 16px", fontSize: 13 }}>Login</button>
              <button className="bp" onClick={() => go("register")} style={{ padding: "6px 16px", fontSize: 13 }}>Sign Up</button>
            </div>
          </nav>

          <section style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", padding: "130px 24px 40px" }}>
            <div style={{ display: "inline-flex", alignItems: "center", gap: 10, background: "rgba(247,147,26,.07)", border: "1px solid rgba(247,147,26,.18)", borderRadius: 100, padding: "7px 20px", marginBottom: 30, fontSize: 13 }}>
              <div className="dot" />
              <span style={{ color: "var(--t2)" }}>BTC/USD Live</span>
              <span style={{ color: "var(--btc)", fontWeight: 700 }}>${price}</span>
            </div>

            <h1 style={{ fontSize: "clamp(36px, 6vw, 72px)", fontWeight: 900, lineHeight: 1.1, maxWidth: 800, marginBottom: 20 }}>
              Secure Bitcoin Investment <br/><span style={{ color: "var(--btc)" }}>With Guaranteed Return.</span>
            </h1>
            <p style={{ color: "var(--t2)", maxWidth: 500, marginBottom: 40, fontSize: 15, lineHeight: 1.6 }}>
              Institutional grade crypto asset management with audited 24-hour manual withdrawal security.
            </p>

            <div style={{ display: "flex", gap: 12, marginBottom: 60 }}>
              <button className="bp" onClick={() => go("register")} style={{ padding: "12px 32px" }}>Get Started</button>
              <button className="bo" onClick={() => go("login")} style={{ padding: "12px 32px" }}>Dashboard</button>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 20, width: "100%", maxWidth: 800 }}>
              {PLANS.map(p => (
                <div key={p.id} className="card text-left border border-slate-800">
                  <div style={{ fontSize: 24 }}>{p.icon}</div>
                  <div style={{ color: p.color, fontWeight: 700, fontSize: 14, marginTop: 4 }}>{p.name}</div>
                  <div style={{ fontSize: 32, fontWeight: 900 }}>{p.roi}%</div>
                  <div style={{ color: "var(--t2)", fontSize: 12 }}>ROI / {p.days} Days</div>
                </div>
              ))}
            </div>
          </section>

          <footer style={{ borderTop: "1px solid var(--bd)", padding: "24px", display: "flex", justifyContent: "space-between", fontSize: 12, color: "var(--t3)" }}>
            <span>© 2026 BTCVault System.</span>
            <span style={{ color: "var(--btc)", cursor: "pointer" }} onClick={() => go("login")}>Admin Portal</span>
          </footer>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════
       AUTH PAGE
    ═══════════════════════════════════════════════════════ */
    function AuthPage({ mode, go, toast }) {
      const [f, setF] = useState({ name: "", email: "", password: "" });
      const [loading, setLoading] = useState(false);

      const submit = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          if (mode === "login") {
            if (f.email === ADMIN.email && f.password === ADMIN.password) {
              setSession({ role: "admin", email: f.email });
              toast("Admin Authentication Verified", "success");
              go("admin");
              return;
            }
            const users = getUsers();
            const u = users.find(x => x.email === f.email && x.password === f.password);
            if (!u) { toast("Invalid credentials", "err"); setLoading(false); return; }
            setSession({ role: "user", email: u.email, id: u.id });
            toast("Access Granted", "success");
            go("dashboard");
          } else {
            if (!f.email || !f.password) { toast("Fields required", "err"); setLoading(false); return; }
            const users = getUsers();
            if (users.some(x => x.email === f.email)) { toast("Email already in use", "err"); setLoading(false); return; }
            const newUser = { id: uid(), name: f.name || "User", email: f.email, password: f.password, balance: 0.04500000, earnings: 0.00125000 };
            users.push(newUser);
            setUsers(users);
            setSession({ role: "user", email: newUser.email, id: newUser.id });
            toast("Account Setup Complete", "success");
            go("dashboard");
          }
        }, 800);
      };

      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--g)", padding: 24 }}>
          <div className="card" style={{ width: "100%", maxWidth: 360 }}>
            <h2 style={{ fontSize: 22, fontWeight: 900, marginBottom: 20, textTransform: "capitalize" }}>{mode} Portal</h2>
            <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {mode === "register" && (
                <input type="text" placeholder="Full Name" className="inp" value={f.name} onChange={e => setF({...f, name: e.target.value})} />
              )}
              <input type="email" placeholder="Email Address" className="inp" value={f.email} onChange={e => setF({...f, email: e.target.value})} />
              <input type="password" placeholder="Account Password" className="inp" value={f.password} onChange={e => setF({...f, password: e.target.value})} />
              <button type="submit" className="bp" style={{ padding: 12, marginTop: 10 }}>{loading ? "Verifying..." : "Continue"}</button>
            </form>
            <p style={{ fontSize: 13, color: "var(--t2)", marginTop: 20, textAlign: "center", cursor: "pointer" }} onClick={() => go(mode === "login" ? "register" : "login")}>
              {mode === "login" ? "Create an account instead" : "Sign into existing profile"}
            </p>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════
       USER DASHBOARD
    ═══════════════════════════════════════════════════════ */
    function Dashboard({ go, toast }) {
      const session = getSession();
      const users = getUsers();
      const currentUser = users.find(x => x.id === session?.id) || { name: "Premium Investor", balance: 0.045, earnings: 0.00125 };
      const [address, setAddress] = useState("");
      const [amount, setAmount] = useState("");
      const withdrawals = getWithdrawals().filter(w => w.userId === currentUser.id);

      const handleWithdrawal = (e) => {
        e.preventDefault();
        const amt = parseFloat(amount);
        if (!address || isNaN(amt) || amt <= 0) { toast("Invalid Request Information", "err"); return; }
        if (amt > currentUser.balance) { toast("Deficit Account Vault Balance", "err"); return; }

        const allW = getWithdrawals();
        allW.unshift({ id: uid(), userId: currentUser.id, email: currentUser.email, amount: amt, address, status: "Pending", date: now() });
        setWithdrawals(allW);

        currentUser.balance = parseFloat((currentUser.balance - amt).toFixed(8));
        setUsers(users.map(u => u.id === currentUser.id ? currentUser : u));
        setAmount(""); setAddress("");
        toast("Withdrawal Filed. Awaiting Manual Node Broadcast.", "success");
      };

      return (
        <div style={{ background: "var(--g)", minHeight: "100vh", padding: "40px 20px" }}>
          <div style={{ maxWidth: 900, margin: "0 auto" }}>
            <header style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 30 }}>
              <div>
                <h1 style={{ fontSize: 24, fontWeight: 900 }}>Console // {currentUser.name}</h1>
                <p style={{ color: "var(--t2)", fontSize: 13 }}>Protected Asset Interface Node</p>
              </div>
              <button className="bo" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => { clearSession(); go("landing"); }}>Logout</button>
            </header>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 20, marginBottom: 30 }}>
              <div className="card border border-slate-800">
                <div style={{ color: "var(--t2)", fontSize: 11, letterSpacing: 1 }}>ACTIVE HOLDING</div>
                <h2 style={{ fontSize: 28, color: "var(--btc)", fontWeight: 700 }}>{currentUser.balance} BTC</h2>
              </div>
              <div className="card border border-slate-800">
                <div style={{ color: "var(--t2)", fontSize: 11, letterSpacing: 1 }}>TOTAL SETTLED EARNINGS</div>
                <h2 style={{ fontSize: 28, color: "var(--gr)", fontWeight: 700 }}>{currentUser.earnings} BTC</h2>
              </div>
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: 20 }}>
              <div className="card border border-slate-800">
                <h3 style={{ fontSize: 16, marginBottom: 14 }}>File Manual Payout Request</h3>
                <form onSubmit={handleWithdrawal} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <input type="number" step="any" placeholder="Amount (BTC)" className="inp" value={amount} onChange={e => setAmount(e.target.value)} />
                  <input type="text" placeholder="Destination BTC Address" className="inp" value={address} onChange={e => setAddress(e.target.value)} />
                  <button type="submit" className="bp" style={{ padding: 11, marginTop: 6 }}>Request Clearance</button>
                </form>
              </div>

              <div className="card border border-slate-800">
                <h3 style={{ fontSize: 16, marginBottom: 14 }}>Audit History Logs</h3>
                {withdrawals.length === 0 ? <p style={{ color: "var(--t3)", fontSize: 13 }}>No transactional actions recorded.</p> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                    {withdrawals.map(w => (
                      <div key={w.id} className="row" style={{ fontSize: 12 }}>
                        <div>
                          <div style={{ fontWeight: 700 }}>{w.amount} BTC</div>
                          <div style={{ fontSize: 10, color: "var(--t3)" }}>{fmtDate(w.date)}</div>
                        </div>
                        <span className={`badge ${w.status === "Pending" ? "by" : "bg"}`}>{w.status}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════
       ADMIN CONSOLE
    ═══════════════════════════════════════════════════════ */
    function AdminConsole({ go, toast }) {
      const [requests, setRequests] = useState(getWithdrawals());

      const approve = (id) => {
        const updated = getWithdrawals().map(w => w.id === id ? { ...w, status: "Completed" } : w);
        setWithdrawals(updated);
        setRequests(updated);
        toast("Transaction Released & Signed.", "success");
      };

      return (
        <div style={{ background: "var(--g)", minHeight: "100vh", padding: 40 }}>
          <div style={{ maxWidth: 800, margin: "0 auto" }}>
            <header style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 30 }}>
              <div>
                <h1 style={{ fontSize: 24, fontWeight: 900 }}>Vault Core Clearing House</h1>
                <p style={{ color: "var(--t2)", fontSize: 13 }}>Manual Multi-Sig Payout Authorization Board</p>
              </div>
              <button className="bo" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => { clearSession(); go("landing"); }}>Exit Admin</button>
            </header>

            <div className="card border border-slate-800">
              <h2 style={{ fontSize: 16, marginBottom: 20 }}>Awaiting Approval Queue Ledger</h2>
              {requests.length === 0 ? <p style={{ color: "var(--t3)", fontSize: 14 }}>Clear. No pending network calls pending validation.</p> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                  {requests.map(w => (
                    <div key={w.id} className="row" style={{ padding: "14px 0" }}>
                      <div>
                        <span style={{ color: "var(--btc)", fontWeight: 700 }}>{w.amount} BTC</span>
                        <div style={{ fontSize: 11, color: "var(--t2)", marginTop: 2 }}>User: {w.email}</div>
                        <div style={{ fontSize: 10, color: "var(--t3)" }}>Target: {w.address}</div>
                      </div>
                      <div>
                        {w.status === "Pending" ? (
                          <button className="bp" style={{ padding: "6px 14px", fontSize: 12 }} onClick={() => approve(w.id)}>Approve & Dispatch</button>
                        ) : <span className="badge bg">Settled</span>}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════
